# MindSlop fork: Lua 5.4 only, Linux x86_64, Windows x86_64 and macOS universal.
# Upstream builds every platform and LuaJIT; this fork only ships what MindSlop uses.
name: Build and Test
on:
  push:
    branches: [mindslop]
    tags: ["mindslop-*"]
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  SCONS_VERSION: 4.10.1
  GODOT_VERSION: 4.7.2-stable

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        platform: [linux, windows, macos]
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
          - platform: windows
            arch: x86_64
            runner: windows-latest
          - platform: macos
            arch: universal
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup godot-cpp
        uses: ./lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
          scons-version: ${{ env.SCONS_VERSION }}
          windows-compiler: msvc
      - name: Cache SCons files
        uses: actions/cache@v4
        with:
          path: .scons-cache/
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-lua-${{ hashfiles('.gitmodules', 'src/**', 'tools/**') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-lua-
      - name: Build artifact
        env:
          PYTHON_BIN: python3
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            scons platform=windows arch=${{ matrix.arch }} target=${{ matrix.target }} lua_runtime=lua \
              vcvarsall_path="C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          else
            scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }} lua_runtime=lua
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            addons/lua-gdextension/build/lib*

  test:
    name: Test ${{ matrix.name }}
    needs: [build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            godot-zip: Godot_v4.7.2-stable_linux.x86_64.zip
            godot-bin: ./Godot_v4.7.2-stable_linux.x86_64
          - name: Windows
            runner: windows-latest
            godot-zip: Godot_v4.7.2-stable_win64.exe.zip
            godot-bin: ./Godot_v4.7.2-stable_win64.exe
          - name: macOS
            runner: macos-latest
            godot-zip: Godot_v4.7.2-stable_macos.universal.zip
            godot-bin: ./Godot.app/Contents/MacOS/Godot
    env:
      GODOT_BIN: ${{ matrix.godot-bin }}
      MSYS_NO_PATHCONV: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup godot-cpp
        uses: ./lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: linux
          scons-version: ${{ env.SCONS_VERSION }}
      - name: Copy artifacts to build folder
        env:
          PYTHON_BIN: python3
        run: |
          scons lua_runtime=lua addons_files
          cp -r '${{ steps.download.outputs.download-path }}'/**/lib* addons/lua-gdextension/build
      - name: Download Godot
        run: |
          curl --fail --location https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/${{ matrix.godot-zip }} --output godot.zip
          unzip -q godot.zip
      - name: Run tests
        run: |
          make test

  distribute:
    name: Distribute zip
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup godot-cpp
        uses: ./lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: linux
          scons-version: ${{ env.SCONS_VERSION }}
      - name: Assemble addon
        env:
          PYTHON_BIN: python3
        run: |
          scons lua_runtime=lua addons_files
          cp -r ${{ steps.download.outputs.download-path }}/**/lib* addons/lua-gdextension/build
          zip -qr lua-gdextension.zip LICENSE addons/lua-gdextension
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lua-gdextension
          path: lua-gdextension.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/mindslop-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" lua-gdextension.zip \
            --title "${{ github.ref_name }}" \
            --notes "MindSlop fork of lua-gdextension 0.8.2: memory limit enforced in the allocator, LUA_NOCVTS2N, Lua API access from GDScript run in protected mode."
